spring.application.name=student-management-system
spring.datasource.url=jdbc:mysql://localhost:3306/student_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Replace this with a strong random secret of at least 32 bytes in real deployments.
app.jwt.secret=change-this-secret-key-to-a-long-random-secret-value-123456
app.jwt.expiration-ms=3600000
